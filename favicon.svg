<?xml version="1.0" encoding="UTF-8"?>
<!-- The browser-tab icon of every site and app of the business: icons/logo.svg filling a square with an even margin (2% each side),
     see-through. Regenerate the PNG fallbacks beside it with scripts/make-favicons.sh; the drawing is the logo's own, with its
     hairline outlines replaced by a visible one on the white face (light browser chrome) and lightened dark faces under
     prefers-color-scheme: dark (dark browser chrome). Same geometry as logo.svg: the logo's 727.7 x 659.5 box centred in 758 x 758. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 758 758">
  <style>
    .lightFace { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 10; stroke-linejoin: round; }
    .darkFace { fill: #000000; }
    .bottomFace { fill: #212121; }
    .purpleFace { fill: #900090; }
    @media (prefers-color-scheme: dark) {
      .lightFace { stroke: none; }
      .darkFace { fill: #8a8a8a; }
      .bottomFace { fill: #6a6a6a; }
    }
  </style>
